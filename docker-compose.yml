# =============================================================================
# AlphaScan — Docker Compose (Production)
# =============================================================================
# Usage:
#   1. Copy .env.example to .env and fill in your API keys
#   2. docker compose up -d
#   3. Open http://localhost:8000
#
# The single container serves both the API and the frontend.
# =============================================================================

services:
  alphascan:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alphascan
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - UVICORN_WORKERS=${UVICORN_WORKERS:-2}
    volumes:
      # Persist scan data across restarts
      - alphascan-data:/app/data
      - alphascan-exports:/app/exports
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  alphascan-data:
    driver: local
  alphascan-exports:
    driver: local
