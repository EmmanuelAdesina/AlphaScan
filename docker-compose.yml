# =============================================================================
# AlphaScan — Docker Compose (Production)
# =============================================================================
# Usage:
#   1. Copy .env.example to .env and fill in your API keys
#   2. docker compose up -d
#   3. Open http://localhost:8000
#
# The single container serves both the API and the frontend.
# =============================================================================

services:
  alphascan:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alphascan
    restart: unless-stopped
    ports:
      # The default remote/local deployment port is 8000. Override HOST_PORT
      # only when the server exposes a different public port.
      - "${HOST_PORT:-8000}:${PORT:-8000}"
    env_file:
      - .env
    environment:
      # PORT defaults to 8000 but can be supplied by a cloud platform.
      - PORT=${PORT:-8000}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - UVICORN_WORKERS=${UVICORN_WORKERS:-2}
    volumes:
      # Persist scan data across restarts
      - alphascan-data:/app/data
      - alphascan-exports:/app/exports
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.getenv('PORT', '8000') + '/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  alphascan-data:
    driver: local
  alphascan-exports:
    driver: local
